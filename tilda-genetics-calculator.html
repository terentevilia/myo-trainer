<!--
  TERENTEV FIT — калькулятор генетического потенциала

<meta charset="UTF-8">

<style>
  .tf-genetics-calculator {
    --tf-gc-bg: #0e0f12;
    --tf-gc-card: #1b1b25;
    --tf-gc-card-soft: rgba(255, 255, 255, 0.07);
    --tf-gc-ink: #ffffff;
    --tf-gc-muted: rgba(255, 255, 255, 0.62);
    --tf-gc-line: rgba(255, 255, 255, 0.13);
    --tf-gc-accent: #2c4190;
    --tf-gc-accent-hover: #3652ad;
    --tf-gc-danger: #ff8d8d;
    --tf-gc-radius-lg: 34px;
    --tf-gc-radius-md: 22px;
    --tf-gc-font: Arial, "Helvetica Neue", sans-serif;

    width: 100%;
    color: var(--tf-gc-ink);
    background: var(--tf-gc-bg);
    font-family: var(--tf-gc-font);
    font-size: 16px;
    line-height: 1.45;
    -webkit-font-smoothing: antialiased;
    text-rendering: optimizeLegibility;
  }

  .tf-genetics-calculator *::before,
  .tf-genetics-calculator *::after {
    box-sizing: border-box;
  }

  .tf-genetics-calculator button,
  .tf-genetics-calculator input {
    font: inherit;
  }

  .tf-genetics-calculator button {
    color: inherit;
  }

  .tf-genetics-calculator .tf-gc__shell {
    width: min(1120px, calc(100% - 40px));
    margin: 0 auto;
    padding: 72px 0;
  }

    display: inline-flex;

    gap: 9px;
    margin: 0 0 22px;
    color: var(--tf-gc-muted);
    font-size: 12px;
    font-weight: 700;
    letter-spacing: 0.13em;
    line-height: 1.2;
    text-transform: uppercase;
  }

    width: 8px;
    height: 8px;
    border-radius: 50%;

  }

  .tf-genetics-calculator .tf-gc__step-title,
  .tf-genetics-calculator .tf-gc__result-title {
    margin: 0;
    font-weight: 750;
    letter-spacing: -0.055em;
    line-height: 0.98;
  }

  .tf-genetics-calculator .tf-gc__title {

    font-size: clamp(46px, 7vw, 92px);
  }

    color: var(--tf-gc-muted);
    font-size: clamp(17px, 2vw, 21px);

  }

    margin: 24px 0 0;

    font-size: 14px;
    line-height: 1.45;

    display: grid;
    width: 24px;
    height: 24px;
    flex: 0 0 auto;
    border-radius: 50%;
    place-items: center;
    background: var(--tf-gc-accent);
    color: #ffffff;
    font-size: 13px;
    font-weight: 800;
  }

    display: grid;
    grid-template-columns: minmax(0, 1.65fr) minmax(280px, 0.65fr);

    align-items: stretch;

  .tf-genetics-calculator .tf-gc__start-aside,

    flex-direction: column;
    justify-content: space-between;
    gap: 60px;

  .tf-genetics-calculator .tf-gc__start-aside {

    padding: 34px;

    font-size: 23px;
    font-weight: 800;

    margin-bottom: 4px;
    color: #ffffff;
    font-size: 24px;
    font-weight: 750;
    letter-spacing: -0.035em;
  }

  .tf-genetics-calculator .tf-gc__fact-label {
    color: rgba(255, 255, 255, 0.66);
    font-size: 13px;
  }

    min-height: 58px;
    padding: 0 24px;
    border: 1px solid transparent;
    border-radius: 999px;

    font-size: 15px;
    font-weight: 750;
    line-height: 1.1;
    text-align: center;

    transform: translateY(-2px);
  }

  .tf-genetics-calculator .tf-gc__btn:active {
    transform: translateY(0);
  }

  .tf-genetics-calculator .tf-gc__choice:focus-within,
  .tf-genetics-calculator .tf-gc__input:focus-visible {
    outline: 3px solid rgba(255, 255, 255, 0.42);
    outline-offset: 3px;
  }

    background: var(--tf-gc-accent);
    color: #ffffff;
  }

  .tf-genetics-calculator .tf-gc__btn--primary:hover {
    background: var(--tf-gc-accent-hover);
  }

  .tf-genetics-calculator .tf-gc__btn--accent {

    color: #ffffff;
  }

  }

    font-weight: 600;

    color: var(--tf-gc-muted);

    font-weight: 600;

    font-weight: 700;

    justify-content: space-between;
    gap: 18px;
    background: var(--tf-gc-bg);

    background: var(--tf-gc-accent);
  }

  .tf-genetics-calculator .tf-gc__choice input {
    position: absolute;
    width: 1px;
    height: 1px;
    opacity: 0;
  }

  .tf-genetics-calculator .tf-gc__choice-title {
    display: block;
    font-size: 22px;
    font-weight: 750;
    letter-spacing: -0.03em;
  }

  .tf-genetics-calculator .tf-gc__choice-copy {

    margin-top: 5px;

  }

    height: 28px;

  }

  .tf-genetics-calculator .tf-gc__nav {

  .tf-genetics-calculator .tf-gc__score-value {

    function escapeHtml(value) {
      return String(value == null ? "" : value)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }

    function parseNumber(value) {
      return Number(String(value).trim().replace(",", "."));
    }

    function formatNumber(value, digits) {
      if (!Number.isFinite(value)) return "—";
      return value.toLocaleString("ru-RU", {
        minimumFractionDigits: digits,
        maximumFractionDigits: digits
      });
    }

    function formatPercent(value, digits) {
      return formatNumber(value * 100, digits) + "%";
    }

    function getActiveSteps() {
      return CONFIG.steps.filter(function (step) {
        return typeof step.when !== "function" || step.when(state.answers);
      });
    }

    function getFieldById(fieldId) {
      var allFields = [];
      CONFIG.steps.forEach(function (step) {
        allFields = allFields.concat(step.fields || []);
      });
      return allFields.find(function (field) { return field.id === fieldId; });
    }

    function renderStart() {

      app.innerHTML =
        '<div class="tf-gc__screen tf-gc__start-layout">' +

    function renderRadioField(field) {
      var selected = state.answers[field.id];
      var optionsHtml = field.options.map(function (option) {
        var checked = selected === option.value ? " checked" : "";

          '<input type="radio" name="' + escapeHtml(field.id) + '" value="' + escapeHtml(option.value) + '"' + checked + '>' +

      }).join("");

      return '<div class="tf-gc__field tf-gc__field--full" data-field="' + escapeHtml(field.id) + '">' +
        '<div class="tf-gc__choices">' + optionsHtml + '</div>' +
        '<p class="tf-gc__error" data-error-for="' + escapeHtml(field.id) + '" aria-live="polite"></p>' +

      return '<div class="tf-gc__field" data-field="' + escapeHtml(field.id) + '">' +
        '<label class="tf-gc__label" for="tf-gc-' + escapeHtml(field.id) + '">' +

    function renderStep() {
      var steps = getActiveSteps();
      if (state.stepIndex >= steps.length) state.stepIndex = steps.length - 1;

      var progress = Math.round(((state.stepIndex + 1) / steps.length) * 100);
      var fieldsHtml = step.fields.map(function (field) {
        return field.type === "radio" ? renderRadioField(field) : renderNumberField(field);
      }).join("");

        '<div class="tf-gc__screen tf-gc__panel">' +
          '<div class="tf-gc__progress-wrap">' +

          state.answers[field.id] = input ? input.value.trim() : "";
        }
      });
    }

    function showFieldError(field, message) {
      var error = root.querySelector('[data-error-for="' + field.id + '"]');
      var input = root.querySelector('[name="' + field.id + '"]');
      if (error) error.textContent = message;
      if (input && field.type !== "radio") input.setAttribute("aria-invalid", "true");
    }

    function clearFieldError(fieldId) {
      var error = root.querySelector('[data-error-for="' + fieldId + '"]');
      var input = root.querySelector('[name="' + fieldId + '"]');
      if (error) error.textContent = "";
      if (input) input.removeAttribute("aria-invalid");
    }

    function validateStep() {
      var steps = getActiveSteps();
      var step = steps[state.stepIndex];
      var firstInvalid = null;
      var valid = true;

      step.fields.forEach(function (field) {
        clearFieldError(field.id);
        var rawValue = state.answers[field.id];

        if (field.required && (rawValue == null || rawValue === "")) {
          showFieldError(field, field.type === "radio" ? CONFIG.texts.choiceError : CONFIG.texts.requiredError);
          if (!firstInvalid) firstInvalid = root.querySelector('[name="' + field.id + '"]');
          valid = false;
          return;
        }

        if (field.type === "number") {
          var value = parseNumber(rawValue);
          if (!Number.isFinite(value)) {
            showFieldError(field, CONFIG.texts.numberError);
            if (!firstInvalid) firstInvalid = root.querySelector('[name="' + field.id + '"]');
            valid = false;
          } else if (value < field.min || value > field.max) {
            showFieldError(field, "Допустимый диапазон: " + field.min + "–" + field.max + " " + (field.unit || "") + ".");
            if (!firstInvalid) firstInvalid = root.querySelector('[name="' + field.id + '"]');
            valid = false;
          }
        }
      });

      if (firstInvalid && typeof firstInvalid.focus === "function") firstInvalid.focus();
      return valid;
    }

    /*
      ВСЯ РАСЧЁТНАЯ ЛОГИКА СОБРАНА ЗДЕСЬ.

      Источник: Google Sheet, лист «Максимальный мышечный потенциал».
      Ввод из интерфейса переводится в единицы таблицы:
      - рост: см -> метры (B2) и дюймы (O27 = B2 * 39.3701);
      - окружности: см -> дюймы (формула листа «Конвертация»: см / 2.54);
      - вес остаётся в кг (B3).

      Формулы ниже повторяют конкретные ячейки таблицы. Новых коэффициентов
      в расчёт не добавлено. Текстовые трактовки результата находятся в CONFIG
      и не участвуют в математике.
    */
    function calculateResult(answers) {
      var heightM = parseNumber(answers.height) / 100;
      var weightKg = parseNumber(answers.weight);
      var bodyFat = parseNumber(answers.bodyFat);
      var targetBodyFat = parseNumber(answers.targetBodyFat);
      var wristInches = parseNumber(answers.wrist) / 2.54;
      var ankleInches = parseNumber(answers.ankle) / 2.54;

      /* O27 = B2 * 39.3701 */
      var heightInches = heightM * 39.3701;

      /* S25 = B3 * (1 - B4 / 100) * B2^(-2) */
      var baseFfmi = weightKg * (1 - bodyFat / 100) * Math.pow(heightM, -2);

      /* E3 и F3: скорректированный FFMI для роста, женский вариант / 0.85. */
      var ffmiMale = baseFfmi + 6.1 * (1.8 - heightM);
      var ffmiFemale = baseFfmi / 0.85 + 6.1 * (1.8 - heightM);

      /*
        E5 = ((O27 * (B6/7.2546 + B7/5.9772) * (B5/450 + 1)) * 1.024) / 2.20462
        F5 = E5 * 0.85
      */
      var maxLeanMaleKg = ((heightInches * (wristInches / 7.2546 + ankleInches / 5.9772) * (targetBodyFat / 450 + 1)) * 1.024) / 2.20462;
      var maxLeanFemaleKg = maxLeanMaleKg * 0.85;
      var selectedMaxLeanKg = answers.sex === "female" ? maxLeanFemaleKg : maxLeanMaleKg;

      /* E4/F4 = (макс. сухая масса / (100 - желаемый % жира)) * 100 */
      var maxBodyWeightKg = (selectedMaxLeanKg / (100 - targetBodyFat)) * 100;

      /* E6/F6 = (вес * (100 - текущий % жира) / макс. сухая масса) / 100 */
      var currentLeanKg = weightKg * (100 - bodyFat) / 100;
      var achieved = currentLeanKg / selectedMaxLeanKg;

      var result = {
        ffmi: answers.sex === "female" ? ffmiFemale : ffmiMale,
        maxBodyWeightKg: maxBodyWeightKg,
        maxLeanKg: selectedMaxLeanKg,
        currentLeanKg: currentLeanKg,
        achieved: achieved,
        parts: []
      };

      if (answers.sex === "male") {
        /* D8:D13 — максимальные мужские обхваты в дюймах. */
        var partModels = [
          {
            id: "chest",
            label: "Грудь",
            /* D8 = 1.625*B6 + 1.3682*B7 + 0.3562*O27 */
            potentialInches: 1.625 * wristInches + 1.3682 * ankleInches + 0.3562 * heightInches
          },
          {
            id: "biceps",
            label: "Бицепс",
            /* D9 = 1.1709*B6 + 0.135*O27 */
            potentialInches: 1.1709 * wristInches + 0.135 * heightInches
          },
          {
            id: "forearm",
            label: "Предплечье",
            /* D10 = 0.95*B6 + 0.1041*O27 */
            potentialInches: 0.95 * wristInches + 0.1041 * heightInches
          },
          {
            id: "neck",
            label: "Шея",
            /* D11 = 1.1875*B6 + 0.1301*O27 */
            potentialInches: 1.1875 * wristInches + 0.1301 * heightInches
          },
          {
            id: "thigh",
            label: "Одно бедро",
            /* D12 = 1.4737*B7 + 0.1918*O27 */
            potentialInches: 1.4737 * ankleInches + 0.1918 * heightInches
          },
          {
            id: "calf",
            label: "Икроножная мышца",
            /* D13 = 0.9812*B7 + 0.125*O27 */
            potentialInches: 0.9812 * ankleInches + 0.125 * heightInches
          }
        ];

        /* E8:E13 = фактический обхват / максимальный обхват. */
        partModels.forEach(function (part) {
          part.currentCm = parseNumber(answers[part.id]);
          part.potentialCm = part.potentialInches * 2.54;
          part.progress = (part.currentCm / 2.54) / part.potentialInches;
        });

        var averageProgress = partModels.reduce(function (sum, part) {
          return sum + part.progress;
        }, 0) / partModels.length;

        /* F8:F13 = E(row) / AVERAGE(E8:E13). */
        partModels.forEach(function (part) {
          part.relative = part.progress / averageProgress;
        });

        result.parts = partModels;
      }

      return result;
    }

    function getFfmiBenchmark(ffmi) {
      return CONFIG.result.ffmiBenchmarks.find(function (benchmark) {
        return ffmi >= benchmark.min;
      });
    }

    function getAchievedExplanation(achieved) {
      return CONFIG.result.achievedExplanations.find(function (item) {
        return achieved < item.max;
      });
    }

    function renderFfmiComparison(ffmi) {
      var benchmarks = CONFIG.result.ffmiBenchmarks.filter(function (benchmark) {
        return Number.isFinite(benchmark.min);
      });
      var rows = [];
      var inserted = false;

      function currentRow() {
        return '<div class="tf-gc__ffmi-row tf-gc__ffmi-row--current" role="row">' +
          '<div class="tf-gc__ffmi-value" role="cell">' + formatNumber(ffmi, 0) + '</div>' +
          '<div class="tf-gc__ffmi-description" role="cell">Твой результат</div>' +
        '</div>';
      }

      benchmarks.forEach(function (benchmark) {
        if (!inserted && ffmi >= benchmark.min) {
          rows.push(currentRow());
          inserted = true;
        }

        rows.push('<div class="tf-gc__ffmi-row" role="row">' +
          '<div class="tf-gc__ffmi-value" role="cell">' + formatNumber(benchmark.min, Number.isInteger(benchmark.min) ? 0 : 1) + '</div>' +
          '<div class="tf-gc__ffmi-description" role="cell">' + escapeHtml(benchmark.label) + '</div>' +
        '</div>');
      });

      if (!inserted) rows.push(currentRow());

      return '<div class="tf-gc__ffmi-table" role="table" aria-label="Сравнительная таблица FFMI">' +
        '<div class="tf-gc__ffmi-head" role="row">' +
          '<div role="columnheader">FFMI</div>' +
          '<div role="columnheader">Среднестатистические данные</div>' +
        '</div>' +
        rows.join("") +
      '</div>';
    }

    function renderParts(parts) {
      if (!parts.length) {
        return '<div class="tf-gc__notice">' +
          '<h3 class="tf-gc__notice-title">Обхваты не рассчитываются для женской модели</h3>' +
          '<p class="tf-gc__notice-copy">В исходной таблице формулы максимальных обхватов прямо помечены как данные только для мужчин. Поэтому интерфейс не показывает неподтверждённую женскую оценку.</p>' +
        '</div>';
      }

      var rows = parts.map(function (part) {
        var relativeDelta = (part.relative - 1) * 100;
        var relativeText = (relativeDelta > 0 ? "+" : "") + formatNumber(relativeDelta, 0) + "% к среднему";
        var relativeClass = Math.abs(relativeDelta) <= 3 ? "tf-gc__pill tf-gc__pill--accent" : "tf-gc__pill";

        return '<div class="tf-gc__part">' +
          '<div class="tf-gc__part-name">' + escapeHtml(part.label) + '</div>' +
          '<div class="tf-gc__part-cell" data-label="Сейчас"><span class="tf-gc__part-number">' + formatNumber(part.currentCm, 0) + ' см</span></div>' +
          '<div class="tf-gc__part-cell" data-label="Ориентир"><span class="tf-gc__part-number">' + formatNumber(part.potentialCm, 0) + ' см</span></div>' +
          '<div class="tf-gc__part-cell" data-label="Достигнуто"><span class="tf-gc__part-number">' + formatPercent(part.progress, 0) + '</span></div>' +
          '<div class="tf-gc__part-cell tf-gc__part-cell--relative" data-label="Относительное развитие"><span class="' + relativeClass + '">' + relativeText + '</span></div>' +
        '</div>';
      }).join("");

      return '<div class="tf-gc__parts">' +
        '<div class="tf-gc__parts-head" aria-hidden="true">' +
          '<span>Часть тела</span><span>Сейчас</span><span>Ориентир</span><span>Достигнуто</span><span>Отн. развитие</span>' +
        '</div>' + rows +
      '</div>';
    }

    function renderResult() {
      var result = calculateResult(state.answers);
      var benchmark = getFfmiBenchmark(result.ffmi);
      var achievedExplanation = getAchievedExplanation(result.achieved);
      var scoreNote = state.answers.sex === "female"
        ? "Женский показатель нормализован коэффициентом 0,85 — в точности как в таблице."
        : "Значение рассчитано по мужской колонке исходной таблицы.";
      var ctaHtml = CONFIG.links.ctaUrl
        ? '<a class="tf-gc__btn tf-gc__btn--accent" href="' + escapeHtml(CONFIG.links.ctaUrl) + '" target="_blank" rel="noopener">' + escapeHtml(CONFIG.links.ctaLabel) + ' ↗</a>'
        : "";

      app.innerHTML =
        '<div class="tf-gc__screen">' +
          '<div class="tf-gc__result-head">' +
            '<div>' +
              '<p class="tf-gc__eyebrow">' + escapeHtml(CONFIG.texts.resultEyebrow) + '</p>' +
              '<h2 class="tf-gc__result-title">' + escapeHtml(CONFIG.texts.resultTitle) + '</h2>' +
            '</div>' +
          '</div>' +
          '<div class="tf-gc__result-hero">' +
            '<div class="tf-gc__score">' +
              '<span class="tf-gc__score-label">Скорректированный FFMI</span>' +
              '<strong class="tf-gc__score-value">' + formatNumber(result.ffmi, 0) + '</strong>' +
              '<span class="tf-gc__score-note">' + escapeHtml(scoreNote) + '</span>' +
            '</div>' +
            '<div class="tf-gc__benchmark">' +
              '<div>' +
                '<span class="tf-gc__benchmark-kicker">Ближайший нижний ориентир таблицы</span>' +
                '<h3 class="tf-gc__benchmark-title">' + escapeHtml(benchmark.label) + '</h3>' +
                '<p class="tf-gc__benchmark-copy">ИСМТ/FFMI показывает мускулистость с поправкой на рост и используется здесь только как сравнительный ориентир.</p>' +
              '</div>' +
              '<span class="tf-gc__pill tf-gc__pill--accent">Расчёт завершён</span>' +
            '</div>' +
          '</div>' +
          '<div class="tf-gc__metrics">' +
            '<article class="tf-gc__metric"><span class="tf-gc__metric-label">Макс. вес при ' + formatNumber(parseNumber(state.answers.targetBodyFat), 0) + '% жира</span><strong class="tf-gc__metric-value">' + formatNumber(result.maxBodyWeightKg, 0) + ' <span class="tf-gc__metric-unit">кг</span></strong></article>' +
            '<article class="tf-gc__metric"><span class="tf-gc__metric-label">Макс. сухая масса</span><strong class="tf-gc__metric-value">' + formatNumber(result.maxLeanKg, 0) + ' <span class="tf-gc__metric-unit">кг</span></strong></article>' +
            '<article class="tf-gc__metric"><span class="tf-gc__metric-label">Текущая сухая масса</span><strong class="tf-gc__metric-value">' + formatNumber(result.currentLeanKg, 0) + ' <span class="tf-gc__metric-unit">кг</span></strong></article>' +
            '<article class="tf-gc__metric"><span class="tf-gc__metric-label">Достигнуто от ориентира</span><strong class="tf-gc__metric-value">' + formatPercent(result.achieved, 0) + '</strong></article>' +
          '</div>' +
          '<section class="tf-gc__section">' +
            '<div class="tf-gc__section-head">' +
              '<h3 class="tf-gc__section-title">Твоя позиция по FFMI</h3>' +
              '<p class="tf-gc__section-copy">Синяя строка показывает твой результат относительно ориентиров из расчётной таблицы.</p>' +
            '</div>' +
            renderFfmiComparison(result.ffmi) +
          '</section>' +
          '<section class="tf-gc__section">' +
            '<div class="tf-gc__section-head">' +
              '<h3 class="tf-gc__section-title">Как читать результат</h3>' +
              '<p class="tf-gc__section-copy">' + escapeHtml(achievedExplanation.text) + '</p>' +
            '</div>' +
            '<div class="tf-gc__notice">' +
              '<h4 class="tf-gc__notice-title">Ориентир, а не жёсткий потолок</h4>' +
              '<p class="tf-gc__notice-copy">Формула чувствительна к проценту жира, окружностям кисти и лодыжки. Если результат выглядит неожиданно, повтори замеры в одинаковых условиях.</p>' +
            '</div>' +
          '</section>' +
          '<section class="tf-gc__section">' +
            '<div class="tf-gc__section-head">' +
              '<h3 class="tf-gc__section-title">Пропорции тела</h3>' +
              '<p class="tf-gc__section-copy">Относительное развитие сравнивает каждую часть со средним процентом достижения по всем шести обхватам.</p>' +
            '</div>' +
            renderParts(result.parts) +
          '</section>' +
          '<div class="tf-gc__result-actions">' +
            ctaHtml +
            '<button class="tf-gc__btn tf-gc__btn--ghost" type="button" data-action="restart">' + escapeHtml(CONFIG.texts.restartButton) + '</button>' +
          '</div>' +
          '<p class="tf-gc__disclaimer">' + escapeHtml(CONFIG.texts.disclaimer) + '</p>' +
        '</div>';
    }

    function scrollToCalculator() {
      if (typeof root.scrollIntoView === "function") {
        root.scrollIntoView({ behavior: "smooth", block: "start" });
      }
    }

    app.addEventListener("click", function (event) {
      var actionElement = event.target.closest("[data-action]");
      if (!actionElement || !root.contains(actionElement)) return;

      var action = actionElement.getAttribute("data-action");

      if (action === "start") {
        state.screen = "steps";
        state.stepIndex = 0;
        renderStep();
        scrollToCalculator();
      }

      if (action === "back") {
        collectStep();
        state.stepIndex = Math.max(0, state.stepIndex - 1);
        renderStep();
        scrollToCalculator();
      }

      if (action === "restart") {
        state.screen = "start";
        state.stepIndex = 0;
        state.answers = {};
        renderStart();
        scrollToCalculator();
      }
    });

    app.addEventListener("input", function (event) {
      var target = event.target;
      if (!target || !target.name) return;
      clearFieldError(target.name);

      if (target.type === "radio") {
        state.answers[target.name] = target.value;
      }
    });

    app.addEventListener("submit", function (event) {
      if (!event.target.matches("[data-step-form]")) return;
      event.preventDefault();
      collectStep();
      if (!validateStep()) return;

      var steps = getActiveSteps();
      if (state.stepIndex < steps.length - 1) {
        state.stepIndex += 1;
        renderStep();
      } else {
        state.screen = "result";
        renderResult();
      }
      scrollToCalculator();
    });

    renderStart();
  })();
</script>
