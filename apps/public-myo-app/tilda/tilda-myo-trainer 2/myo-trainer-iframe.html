<!-- Устаревшее расположение: актуальный код находится в ../../tilda-embed.html. -->
<div id="tfit-myo-embed" style="width:100%;overflow:hidden;background:#f4f3ee">
  <iframe
    id="tfit-myo-frame"
    src="https://myo.terentevfit.ru/"
    title="Тренажёр мио-подходов"
    scrolling="no"
    loading="eager"
    allow="autoplay; fullscreen; picture-in-picture; encrypted-media"
    style="display:block;width:100%;height:1000px;border:0;margin:0;background:#f4f3ee"
  ></iframe>
</div>

<script>
(function () {
  var appOrigin = "https://myo.terentevfit.ru";
  var frame = document.getElementById("tfit-myo-frame");
  if (!frame) return;

  window.addEventListener("message", function (event) {
    if (event.origin !== appOrigin) return;
    if (event.source !== frame.contentWindow) return;
    if (!event.data || event.data.type !== "myo-iframe-height") return;

    var contentHeight = Number(event.data.height);
    if (!Number.isFinite(contentHeight) || contentHeight < 320) return;

    frame.style.height = Math.ceil(contentHeight + 28) + "px";
  });

  frame.addEventListener("load", function () {
    frame.contentWindow.postMessage({ type: "myo-iframe-measure" }, appOrigin);
  });
})();
</script>
